$kind: http-request
url: "{{baseUrl}}/products/{{hiddenProductId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 404", function () {
        pm.response.to.have.status(404);
      });
      pm.test("Phản hồi lỗi có cấu trúc NestJS", function () {
        const body = pm.response.json();
        pm.expect(body.statusCode).to.equal(404);
        pm.expect(body.message).to.satisfy(value => typeof value === "string" || (Array.isArray(value) && value.length > 0));
      });
    language: text/javascript
order: 12000
