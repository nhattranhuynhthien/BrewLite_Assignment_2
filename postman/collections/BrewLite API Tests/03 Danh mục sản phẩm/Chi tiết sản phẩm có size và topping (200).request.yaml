$kind: http-request
url: "{{baseUrl}}/products/{{catalogProductId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Sản phẩm, danh mục, size và topping mẫu đúng dữ liệu", function () {
        const body = pm.response.json();
        pm.expect(body).to.include({ id: pm.variables.get("catalogProductId"), name: "Cà phê sữa đá", basePrice: 30000, isAvailable: true });
        pm.expect(body.category.id).to.equal(body.categoryId);
        pm.expect(body.sizes.map(size => ({ name: size.name, extraPrice: size.extraPrice }))).to.deep.equal([
          { name: "S", extraPrice: 0 }, { name: "M", extraPrice: 5000 }, { name: "L", extraPrice: 10000 },
        ]);
        pm.expect(body.toppings.map(topping => topping.name)).to.have.members(["Trân châu trắng", "Thạch cà phê"]);
        [...body.sizes, ...body.toppings].forEach(option => {
          pm.expect(option.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i);
          pm.expect(option.extraPrice).to.be.at.least(0);
          pm.expect(option.isAvailable).to.equal(true);
        });
      });
    language: text/javascript
order: 10000
