$kind: http-request
url: "{{baseUrl}}/staff/orders"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 403", function () {
        pm.response.to.have.status(403);
      });
      pm.test("Phản hồi lỗi có cấu trúc NestJS", function () {
        const body = pm.response.json();
        pm.expect(body.statusCode).to.equal(403);
        pm.expect(body.message).to.satisfy(value => typeof value === "string" || (Array.isArray(value) && value.length > 0));
      });
    language: text/javascript
order: 3000
