$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "unknown-{{registrationEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () {
        pm.response.to.have.status(401);
      });
      pm.test("Phản hồi lỗi có cấu trúc NestJS", function () {
        const body = pm.response.json();
        pm.expect(body.statusCode).to.equal(401);
        pm.expect(body.message).to.satisfy(value => typeof value === "string" || (Array.isArray(value) && value.length > 0));
      });
    language: text/javascript
order: 8000
