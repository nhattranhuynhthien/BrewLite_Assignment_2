$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registrationEmail}}",
      "fullName": "  Postman Customer  ",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 409", function () {
        pm.response.to.have.status(409);
      });
      pm.test("Phản hồi lỗi có cấu trúc NestJS", function () {
        const body = pm.response.json();
        pm.expect(body.statusCode).to.equal(409);
        pm.expect(body.message).to.satisfy(value => typeof value === "string" || (Array.isArray(value) && value.length > 0));
      });
    language: text/javascript
order: 2000
